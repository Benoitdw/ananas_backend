[project]
name = "ananas-api"
version = "0.1.0"
description = "Ananas — API, worker et scrapers de veille emploi geolocalisee"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.10",
    "email-validator>=2.2",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.11",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ananas*"]

[tool.ruff]
line-length = 100
